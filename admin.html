<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>NuntiaMX Admin</title><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='config.js'></script><style>body{margin:0;background:#060b20;color:#eef4fb;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:25px 18px}.panel{background:#0d1535;border:1px solid #ffffff18;border-radius:18px;padding:20px;margin:15px 0}input,textarea,select{width:100%;box-sizing:border-box;background:#070c24;color:white;border:1px solid #ffffff22;border-radius:9px;padding:11px;margin:5px 0 12px}textarea{min-height:170px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#5eead4;color:#06231f;font-weight:800;cursor:pointer}.item{padding:12px 0;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;gap:10px}.small{color:#a9b6d6}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class='wrap'><p><a href='index.html'>← Sitio</a></p><div id='login' class='panel'><h2>Acceso</h2><input id='email' type='email' placeholder='Correo'><input id='password' type='password' placeholder='Contraseña'><button class='btn' onclick='login()'>Entrar</button><p id='msg'></p></div><div id='app' hidden><div class='panel'><button class='btn' onclick='logout()'>Salir</button><h1>Publicar noticia</h1><div class='row'><div><label>Título</label><input id='title'></div><div><label>Categoría</label><select id='cat'><option>Última hora</option><option>Tecnología</option><option>Cultura pop</option><option>Deportes</option><option>Cine y estrenos</option><option>Curiosidades</option><option>Ciencia</option></select></div></div><label>Resumen</label><input id='summary'><label>Imagen URL</label><input id='image'><label>ID de YouTube (opcional)</label><input id='youtube' placeholder='dQw4w9WgXcQ'><label>Texto (un párrafo por línea)</label><textarea id='content'></textarea><label><input id='pub' type='checkbox' checked> Publicar</label><label><input id='feat' type='checkbox'> Destacado</label><br><button class='btn' onclick='save()'>Guardar</button><button class='btn' onclick='clearForm()'>Nuevo</button><p id='status'></p></div><div class='panel'><h2>Artículos</h2><div id='list'></div></div></div></div><script>const C=window.NUNTIA_CONFIG;let S=null,editing=null;if(C?.supabaseUrl&&!C.supabaseUrl.includes('TU-PROYECTO'))S=supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);async function login(){if(!S)return msg.textContent='Configura config.js primero';let r=await S.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)return msg.textContent=r.error.message;boot()}async function boot(){let r=await S.auth.getUser();if(!r.data.user)return;if(C.adminEmail&&r.data.user.email.toLowerCase()!=C.adminEmail.toLowerCase()){await S.auth.signOut();return msg.textContent='Usuario no autorizado'}loginEl.hidden=true;app.hidden=false;load()}const loginEl=document.getElementById('login');async function logout(){await S.auth.signOut();location.reload()}async function load(){let r=await S.from('posts').select('*').order('created_at',{ascending:false});list.innerHTML=(r.data||[]).map(p=>`<div class=item><div><b>${e(p.title)}</b><div class=small>${e(p.category)} · 👁${p.views} · ♥${p.likes} · ${p.published?'Publicado':'Borrador'}</div></div><div><button onclick='edit(${JSON.stringify(p)})'>Editar</button> <button onclick="del('${p.id}')">Borrar</button></div></div>`).join('')}async function save(){let data={title:title.value.trim(),slug:slug(title.value),category:cat.value,summary:summary.value.trim(),content:content.value.split(/\n+/).map(x=>x.trim()).filter(Boolean),image_url:image.value.trim()||null,youtube_id:youtube.value.trim()||null,published:pub.checked,featured:feat.checked};if(!data.title)return status.textContent='Falta el título';let r=editing?await S.from('posts').update(data).eq('id',editing):await S.from('posts').insert(data);if(r.error)return status.textContent=r.error.message;status.textContent='Guardado';clearForm();load()}function edit(p){editing=p.id;title.value=p.title;cat.value=p.category;summary.value=p.summary||'';image.value=p.image_url||'';youtube.value=p.youtube_id||'';content.value=(p.content||[]).join('\n');pub.checked=p.published;feat.checked=p.featured}async function del(id){if(confirm('¿Eliminar?')){await S.from('posts').delete().eq('id',id);load()}}function clearForm(){editing=null;title.value=summary.value=image.value=youtube.value=content.value='';pub.checked=true;feat.checked=false}const slug=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');const e=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));if(S)S.auth.getSession().then(boot);</script></body></html>
