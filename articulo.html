<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NuntiaMX — Artículo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="articulos.js"></script>
<style>
  :root{
    --navy-deep:#070c24; --navy:#0e1a4a; --navy-mid:#16308f;
    --teal:#17c9b8; --teal-light:#5eead4; --ice:#eef4fb; --ice-dim:#a9b6d6;
    --line:rgba(238,244,251,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--navy-deep); color:var(--ice); font-family:'Manrope', sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  ::selection{background:var(--teal); color:var(--navy-deep);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--teal-light); outline-offset:3px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px clamp(20px,5vw,56px); border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(7,12,36,0.92); backdrop-filter:blur(10px); z-index:20;
  }
  .brand-mark{display:flex; align-items:center; gap:10px;}
  .brand-mark svg{width:28px; height:28px;}
  .brand{font-weight:800; font-size:1.1rem;}
  .brand span{color:var(--teal-light);}
  .back{
    display:inline-flex; align-items:center; gap:8px; font-size:.88rem; font-weight:700; color:var(--ice-dim);
    transition:color .2s ease;
  }
  .back:hover{color:var(--teal-light);}
  .back svg{width:16px; height:16px;}

  main{max-width:720px; margin:0 auto; padding:56px 22px 100px;}
  .art-hero{
    opacity:0; transform:translateY(20px);
    animation:rise .7s cubic-bezier(.16,.84,.44,1) forwards;
  }
  @keyframes rise{to{opacity:1; transform:translateY(0);}}
  .badge{
    display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--teal-light); background:rgba(23,201,184,.1); border:1px solid rgba(94,234,212,.3);
    padding:6px 12px; border-radius:99px; margin-bottom:18px;
  }
  h1{font-size:clamp(1.7rem,4.4vw,2.5rem); font-weight:800; line-height:1.18;}
  .meta{color:var(--ice-dim); font-size:.9rem; margin-top:16px;}
  .thumb-big{
    margin-top:30px; height:220px; border-radius:18px; border:1px solid var(--line);
    background:linear-gradient(135deg, var(--navy-mid), var(--teal) 140%);
    display:flex; align-items:center; justify-content:center; font-size:3.2rem;
  }
  .body-copy{margin-top:34px; font-size:1.05rem; line-height:1.85; color:var(--ice);}
  .body-copy p{margin-bottom:20px; opacity:0; transform:translateY(14px); animation:rise .6s cubic-bezier(.16,.84,.44,1) forwards;}
  .body-copy p:nth-of-type(1){animation-delay:.15s;}
  .body-copy p:nth-of-type(2){animation-delay:.25s;}
  .body-copy p:nth-of-type(3){animation-delay:.35s;}
  .body-copy p:nth-of-type(4){animation-delay:.45s;}
  .body-copy p:nth-of-type(5){animation-delay:.55s;}

  .cta-row{margin-top:48px; padding-top:32px; border-top:1px solid var(--line);}
  .cta-row a{
    display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:12px;
    background:linear-gradient(100deg, var(--teal-light), var(--teal)); color:#06231f; font-weight:700; font-size:.92rem;
  }
  .not-found{padding:80px 0; text-align:center; color:var(--ice-dim);}
</style>
</head>
<body>

<header>
  <div class="brand-mark">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 78 L30 40 L45 62 L62 30 L74 46 L92 14" stroke="#17c9b8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="brand">Nuntia<span>MX</span></span>
  </div>
  <a class="back" href="index.html#articulos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    Volver
  </a>
</header>

<main id="main"></main>

<script>
  function fechaLegible(iso){
    const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const [y,m,d] = iso.split('-').map(Number);
    return `${d} de ${MESES[m-1]} de ${y}`;
  }

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('a');
  const main = document.getElementById('main');
  const art = (typeof ARTICULOS !== 'undefined') ? ARTICULOS.find(x => x.slug === slug) : null;

  if(!art){
    main.innerHTML = `
      <div class="not-found">
        <h2 style="color:var(--ice); margin-bottom:12px;">No encontramos este artículo</h2>
        <p>Puede que el enlace esté mal o el artículo ya no exista.</p>
        <div class="cta-row" style="border:none; justify-content:center; display:flex;">
          <a href="index.html">Volver al inicio</a>
        </div>
      </div>`;
  } else {
    document.title = `${art.titulo} — NuntiaMX`;
    main.innerHTML = `
      <div class="art-hero">
        <span class="badge">${art.categoria}</span>
        <h1>${art.titulo}</h1>
        <div class="meta">${fechaLegible(art.fecha)} · NuntiaMX</div>
        <div class="thumb-big">${art.icono}</div>
      </div>
      <div class="body-copy">
        ${art.contenido.map(p => `<p>${p}</p>`).join('')}
      </div>
      <div class="cta-row">
        <a href="index.html#redes">Síguenos para más</a>
      </div>
    `;
  }
</script>

</body>
</html>
